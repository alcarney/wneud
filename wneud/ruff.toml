line-length = 88
indent-width = 4

[format]
# Be like black where possible
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

docstring-code-format = true
docstring-code-line-length = 80

[lint.isort]
known-first-party = ["wneud"]
force-single-line = true
